<svg height="540" viewBox="0 0 1100 540" width="1100" xmlns="http://www.w3.org/2000/svg"><text fill="#222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="550" y="30">Symbole PT — sommets-sur-sommets impossible pour {3, 5, 7} (premiers entre eux)</text><g transform="translate(180 250)"><g fill="none"><circle r="180" stroke="#14566b" stroke-width="2"/><path d="m0-180 140.6 67.6 34.9 152.4-87.8 117.6h-175.4l-87.8-117.6 34.9-152.4z" stroke="#4a8b9e" stroke-width="2.5"/><path d="m0-180 171.2 124.4-65.4 201.2h-211.6l-65.4-201.2z" stroke="#14566b" stroke-width="2.5"/><path d="m0-180 155.9 270h-311.8z" stroke="#c96f24" stroke-width="2.5"/></g><circle cy="-180" fill="#c96f24" r="5"/><circle fill="#14566b" r="3"/></g><g text-anchor="middle"><text fill="#555" font="600 14px ui-sans-serif, system-ui, sans-serif" x="180" y="465">A — tous sur le même cercle</text><text fill="#888" font="400 11px ui-monospace, monospace" x="180" y="485">15 sommets sur le cercle</text><text fill="#888" font="400 11px ui-monospace, monospace" x="180" y="503">1 sommet partagé (en haut)</text><text fill="#888" font="400 11px ui-monospace, monospace" x="180" y="521">cercle = horizon s = 1/2</text></g><g transform="translate(550 250)"><g fill="none"><circle r="180" stroke="#14566b" stroke-width="2"/><path d="m0-180 140.6 67.6 34.9 152.4-87.8 117.6h-175.4l-87.8-117.6 34.9-152.4z" stroke="#4a8b9e" stroke-width="2.5"/><path d="m0-162.2 154.3 112.1-59 181.3h-190.6l-59-181.3z" stroke="#14566b" stroke-width="2.5"/><path d="m0-131.2 113.6 196.8h-227.2z" stroke="#c96f24" stroke-width="2.5"/></g><circle cy="-180" fill="#c96f24" r="5"/><circle fill="#14566b" r="3"/></g><text fill="#555" font="600 14px ui-sans-serif, system-ui, sans-serif" text-anchor="middle" x="550" y="465">B — sommets sur les côtés (apothème)</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="550" y="485">cercle ⊃ 7-gone ⊃ 5-gone ⊃ 3-gone</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="550" y="503">chaque polygone tangent à l’incercle du précédent</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="550" y="521">cascade descendante 3 → 5 → 7</text><g transform="translate(920 250)"><g fill="none"><circle r="180" stroke="#14566b" stroke-width="2"/><path d="m0-180 140.6 67.6 34.9 152.4-87.8 117.6h-175.4l-87.8-117.6 34.9-152.4z" stroke="#4a8b9e" stroke-width="2.5"/><path d="m0-180 142.6 133.7-54.4 167.8h-176.4l-54.4-167.8z" stroke="#14566b" stroke-width="2.5"/><path d="m0-180 103.9 240h-207.8z" stroke="#c96f24" stroke-width="2.5"/></g><circle cy="-180" fill="#c96f24" r="5"/><circle fill="#14566b" r="3"/></g><text fill="#555" font="600 14px ui-sans-serif, system-ui, sans-serif" text-anchor="middle" x="920" y="465">D — sommet haut partagé, rayons décroissants</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="920" y="485">heptagone (R=180) sur cercle</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="920" y="503">pentagone (R=150), triangle (R=120)</text><text fill="#888" font="400 11px ui-monospace, monospace" text-anchor="middle" x="920" y="521">naissance commune au sommet</text><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13"><g transform="translate(290 65)"><path d="m0 0h20" fill="none" stroke="#14566b" stroke-width="2"/><text fill="#555" x="28" y="4">cercle s = 1/2</text></g><g transform="translate(420 65)"><path d="m0 0h20" fill="none" stroke="#4a8b9e" stroke-width="2.5"/><text fill="#555" x="28" y="4">heptagone p = 7</text></g><g transform="translate(570 65)"><path d="m0 0h20" fill="none" stroke="#14566b" stroke-width="2.5"/><text fill="#555" x="28" y="4">pentagone p = 5</text></g><g transform="translate(720 65)"><path d="m0 0h20" fill="none" stroke="#c96f24" stroke-width="2.5"/><text fill="#555" x="28" y="4">triangle p = 3</text></g><g transform="translate(830 65)"><circle cx="10" fill="#c96f24" r="5"/><text fill="#555" x="28" y="4">sommet partagé</text></g></g></svg>