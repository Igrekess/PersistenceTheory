<svg height="540" viewBox="0 0 1100 540" width="1100" xmlns="http://www.w3.org/2000/svg"><text fill="#222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="550" y="30">Symbole PT — sur une surface courbe (sphère ou tore T³)</text><g transform="translate(225 250)"><g fill="none"><circle r="180" stroke="#14566b" stroke-width="2"/><ellipse opacity=".25" rx="180" ry="50" stroke="#14566b" stroke-dasharray="2 3" stroke-width=".5"/><ellipse opacity=".25" rx="180" ry="100" stroke="#14566b" stroke-dasharray="2 3" stroke-width=".5"/><ellipse opacity=".25" rx="180" ry="150" stroke="#14566b" stroke-dasharray="2 3" stroke-width=".5"/><path d="m0-180a240 240 0 0 1 140.6 67.6 240 240 0 0 1 34.9 152.4 240 240 0 0 1 -87.8 117.6 240 240 0 0 1 -175.4 0 240 240 0 0 1 -87.8-117.6 240 240 0 0 1 34.9-152.4 240 240 0 0 1 140.6-67.6z" stroke="#4a8b9e" stroke-width="2.5"/><path d="m0-180a280 280 0 0 1 171.2 124.4 280 280 0 0 1 -65.4 201.2 280 280 0 0 1 -211.6 0 280 280 0 0 1 -65.4-201.2 280 280 0 0 1 171.2-124.4z" stroke="#14566b" stroke-width="2.5"/><path d="m0-180a320 320 0 0 1 155.9 270 320 320 0 0 1 -311.8 0 320 320 0 0 1 155.9-270z" stroke="#c96f24" stroke-width="2.5"/></g><circle fill="#14566b" r="3"/></g><g text-anchor="middle"><text fill="#555" font="600 14px ui-sans-serif, system-ui, sans-serif" x="225" y="465">E — polygones sphériques</text><text fill="#888" font="400 11px ui-monospace, monospace" x="225" y="485">côtés courbes (arcs de grand cercle)</text><text fill="#888" font="400 11px ui-monospace, monospace" x="225" y="503">excès d’angle = courbure positive</text><text fill="#888" font="400 11px ui-monospace, monospace" x="225" y="521">limite continue : sphère = compactification</text></g><g transform="translate(675 250)"><circle fill="none" r="180" stroke="#14566b" stroke-width="2"/><g fill="#4a8b9e"><circle cy="-180" r="6"/><circle cx="140.6" cy="-112.4" r="6"/><circle cx="175.5" cy="40" r="6"/><circle cx="87.7" cy="1