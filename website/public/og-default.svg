<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2330"/>
      <stop offset="100%" stop-color="#14566b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e89148"/>
      <stop offset="100%" stop-color="#c96f24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Polygones canaux p=3, p=5, p=7 décoratifs (resserrés et remontés) -->
  <g transform="translate(820, 130)" opacity="0.12">
    <!-- Triangle p=3 -->
    <polygon points="0,-90 78,45 -78,45" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- Pentagone p=5 -->
    <polygon points="0,-100 95,-31 59,81 -59,81 -95,-31" fill="none" stroke="#fff" stroke-width="3" transform="translate(0,140)"/>
    <!-- Heptagone p=7 -->
    <polygon points="0,-110 86,-69 105,40 47,103 -47,103 -105,40 -86,-69" fill="none" stroke="#fff" stroke-width="3" transform="translate(0,300)"/>
  </g>

  <!-- TITRE -->
  <text x="80" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="900" fill="#fff">La Théorie</text>
  <text x="80" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="900" fill="#fff">de la Persistance</text>

  <!-- KICKER (signature poétique de l'index) -->
  <text x="80" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="28" font-weight="400" fill="#fff" opacity="0.85">Toute structure dit ce qu’elle est</text>
  <text x="80" y="362" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="28" font-weight="400" fill="#fff" opacity="0.85">en révélant ce qu’elle a dû abandonner.</text>

  <!-- SOUSTITRE orange -->
  <text x="80" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#orange)">
    43 observables · 1644 molécules · 0 paramètre ajusté
  </text>

  <!-- BANDEAU CHAINE LOGIQUE -->
  <g transform="translate(80, 480)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="22" fill="#a3b8c8">s = 1/2</text>
    <text x="120" y="0" font-family="ui-monospace, monospace" font-size="22" fill="#a3b8c8">→</text>
    <text x="160" y="0" font-family="ui-monospace, monospace" font-size="22" fill="#a3b8c8">{2, 3, 5, 7, 11, 13}</text>
    <text x="500" y="0" font-family="ui-monospace, monospace" font-size="22" fill="#a3b8c8">→</text>
    <text x="540" y="0" font-family="ui-monospace, monospace" font-size="22" fill="#a3b8c8">α_EM = 1/137,036</text>
  </g>

  <!-- URL -->
  <text x="80" y="570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#fff" opacity="0.9">www.persistencetheory.org</text>

  <!-- Auteur -->
  <text x="1120" y="570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#fff" opacity="0.7" text-anchor="end">Yan Senez · 2026</text>
</svg>
