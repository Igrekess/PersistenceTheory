<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2330"/>
      <stop offset="100%" stop-color="#14566b"/>
    </linearGradient>

    <!-- Symbole PT — gradients du symbole -->
    <radialGradient id="sym-halo" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0"     stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.12"  stop-color="#ffd96a" stop-opacity="0.65"/>
      <stop offset="0.32"  stop-color="#fecc00" stop-opacity="0.30"/>
      <stop offset="0.65"  stop-color="#fecc00" stop-opacity="0.10"/>
      <stop offset="1"     stop-color="#fecc00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sym-yellow" cx="0" cy="0" r="14.17" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#ffeba9"/>
      <stop offset="0.5" stop-color="#fecc00"/>
      <stop offset="1"   stop-color="#f8ae00"/>
    </radialGradient>
    <radialGradient id="sym-red" cx=".5" cy=".5" fx=".35" fy=".35" r=".55" gradientUnits="objectBoundingBox">
      <stop offset="0"   stop-color="#ef7b5a"/>
      <stop offset="0.5" stop-color="#e30613"/>
      <stop offset="1"   stop-color="#cb181a"/>
    </radialGradient>
    <radialGradient id="sym-green" cx=".5" cy=".5" fx=".35" fy=".35" r=".55" gradientUnits="objectBoundingBox">
      <stop offset="0"   stop-color="#6cbb83"/>
      <stop offset="0.5" stop-color="#009640"/>
      <stop offset="1"   stop-color="#00863e"/>
    </radialGradient>
    <radialGradient id="sym-blue" cx=".5" cy=".5" fx=".35" fy=".35" r=".55" gradientUnits="objectBoundingBox">
      <stop offset="0"   stop-color="#44afcd"/>
      <stop offset="0.5" stop-color="#008eb4"/>
      <stop offset="1"   stop-color="#00747d"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Symbole PT à droite, centré verticalement -->
  <g transform="translate(975, 315)">
    <!-- Halo -->
    <circle r="100" fill="url(#sym-halo)"/>
    <!-- Cercles guides en pointillés (subtils sur fond sombre) -->
    <g fill="none" opacity="0.35">
      <circle r="105.03" stroke="#7dc2e3" stroke-width="1" stroke-dasharray="3 3"/>
      <circle r="71.03"  stroke="#9bc3a2" stroke-width="1" stroke-dasharray="3 3"/>
      <circle r="43.35"  stroke="#e4a78c" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
    <!-- Z/7Z (bleu) -->
    <g fill="url(#sym-blue)">
      <circle cx="0"       cy="-105.45" r="9.92"/>
      <circle cx="82.44"   cy="-65.74"  r="9.92"/>
      <circle cx="102.80"  cy="23.46"   r="9.92"/>
      <circle cx="45.75"   cy="95.00"   r="9.92"/>
      <circle cx="-45.75"  cy="95.00"   r="9.92"/>
      <circle cx="-102.80" cy="23.46"   r="9.92"/>
      <circle cx="-82.44"  cy="-65.74"  r="9.92"/>
    </g>
    <!-- Z/5Z (vert) -->
    <g fill="url(#sym-green)">
      <circle cx="0"      cy="-71.42" r="7.09"/>
      <circle cx="67.93"  cy="-22.07" r="7.09"/>
      <circle cx="41.98"  cy="57.78"  r="7.09"/>
      <circle cx="-41.98" cy="57.78"  r="7.09"/>
      <circle cx="-67.93" cy="-22.07" r="7.09"/>
    </g>
    <!-- Z/3Z (rouge) -->
    <g fill="url(#sym-red)">
      <circle cx="0"      cy="-43.36" r="4.25"/>
      <circle cx="37.55"  cy="21.68"  r="4.25"/>
      <circle cx="-37.55" cy="21.68"  r="4.25"/>
    </g>
    <!-- Disque jaune central -->
    <circle r="14.17" fill="url(#sym-yellow)"/>
  </g>

  <!-- TITRE -->
  <text x="80" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="900" fill="#fff">La Théorie</text>
  <text x="80" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="900" fill="#fff">de la Persistance</text>

  <!-- KICKER (signature poétique de l'index) -->
  <text x="80" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="28" font-weight="400" fill="#fff" opacity="0.85">Toute structure dit ce qu’elle est</text>
  <text x="80" y="362" font-family="ui-sans-serif, system-ui, sans-serif" font-style="italic" font-size="28" font-weight="400" fill="#fff" opacity="0.85">en révélant ce qu’elle a dû abandonner.</text>

  <!-- SOUSTITRE — passé en jaune doré (cohérence avec le noyau du symbole) -->
  <text x="80" y="420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#fecc00">
    43 observables · 1644 molécules · 0 paramètre ajusté
  </text>

  <!-- BANDEAU CHAINE LOGIQUE (premiers actifs colorés en cohérence avec le symbole) -->
  <g transform="translate(80, 480)" font-family="ui-monospace, monospace" font-size="22">
    <text x="0"   y="0" fill="#fecc00">s = 1/2</text>
    <text x="120" y="0" fill="#a3b8c8">→</text>
    <text x="160" y="0" fill="#a3b8c8">{</text>
    <text x="178" y="0" fill="#fecc00">2</text>
    <text x="195" y="0" fill="#a3b8c8">,</text>
    <text x="210" y="0" fill="#e30613">3</text>
    <text x="225" y="0" fill="#a3b8c8">,</text>
    <text x="240" y="0" fill="#009640">5</text>
    <text x="255" y="0" fill="#a3b8c8">,</text>
    <text x="270" y="0" fill="#008eb4">7</text>
    <text x="287" y="0" fill="#a3b8c8">, 11, 13</text>
    <text x="375" y="0" fill="#a3b8c8">}</text>
    <text x="395" y="0" fill="#a3b8c8">→</text>
    <text x="430" y="0" fill="#fecc00">α_EM = 1/137,036</text>
  </g>

  <!-- URL -->
  <text x="80" y="570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#fff" opacity="0.9">www.persistencetheory.org</text>

  <!-- Auteur -->
  <text x="1120" y="570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#fff" opacity="0.7" text-anchor="end">Yan Senez · 2026</text>
</svg>
